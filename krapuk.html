<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d9ecff">
<title>กระปุก</title>
<style>
/* กระปุก: แอปออมเงินออฟไลน์
   Layout: คอลัมน์เดียว พื้นหลังฟ้า-ขาวมีลายแสงหักเหเลื่อนช้า ๆ ทุกชั้นเป็นกระจกแคปซูน/วงกลม
   ขอบกระจกมีแสงสะท้อน (rim light) หมุนตามการเอียงมือถือ จุดเด่นจุดเดียว: แคปซูนยอดรวมกระจกน้ำเงินเข้ม */
:root {
  --ink: #0a1f4a;
  --ink2: #48638f;
  --ink3: #9db2d4;
  --blue: #1f6bff;
  --blue-deep: #0f4fd6;
  --sky: #4cc3ff;
  --navy: #0b2a6b;
  --ice: #eaf5ff;
  --bg0: #e4f1ff;
  --tint: #1f6bff;
  --danger: #d9344f;
  --good: #0f5fe0;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans Thai UI", "Leelawadee UI", Thonburi, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg0);
  color: var(--ink);
  font: 400 15px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
h1, h2, h3, p { margin: 0; }

/* ---------- การ์ดขาวนิ่ม (ไม่ใช้เบลอ ไม่มีแอนิเมชัน เพื่อให้ลื่น) ---------- */
.glass {
  position: relative;
  background: rgba(255, 255, 255, .8);
  border: 1px solid rgba(255, 255, 255, .95);
  box-shadow: 0 4px 14px rgba(15, 60, 160, .1);
}

/* การ์ดน้ำเงินเข้ม (ยอดรวม) */
.glass.deep {
  color: #f2f8ff;
  background: linear-gradient(145deg, #2a67e6, #123a9e);
  border-color: rgba(255, 255, 255, .2);
  box-shadow: 0 8px 20px rgba(15, 55, 160, .28);
}

/* ---------- พื้นหลัง: สีเรียบ ไม่ขยับ ---------- */
#bg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, #f1f8ff 0%, #d9ebff 100%); }

/* ---------- โครง ---------- */
.wrap {
  width: min(100%, 480px);
  margin: 0 auto;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.wrap.enter { animation: rise .42s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 0 6px; }
.top h1 { font-size: 28px; font-weight: 600; color: var(--navy); }
.top-r { display: flex; align-items: center; gap: 10px; }
.lang { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 96px; height: 42px; padding: 3px; border-radius: 21px; }
.lang i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 18px; background: linear-gradient(160deg, #ffffff, #dcecff); box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(15, 70, 190, .25); transition: transform .38s ease; z-index: 0; }
.lang[data-lang="en"] i { transform: translateX(100%); }
.lang button { position: relative; z-index: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--ink2); border-radius: 18px; transition: color .25s; }
.lang button.on { color: var(--blue-deep); font-weight: 600; }
.round {
  width: 46px; height: 46px; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--navy);
  transition: transform .2s ease;
}

/* ---------- ยอดรวม (แคปซูนน้ำเงินเข้ม) ---------- */
.total { border-radius: 46px; padding: 20px 26px 22px; }
.total .lbl { font-size: 13px; font-weight: 500; color: #b7d6ff; }
.total .num {
  margin-top: 2px;
  font-size: clamp(34px, 10.5vw, 46px); font-weight: 600; letter-spacing: -.02em; line-height: 1.12;
  overflow-wrap: anywhere; color: #fff;
}
.total .num small { font-size: .55em; font-weight: 600; color: var(--sky); margin-right: 3px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.badge { padding: 4px 11px; border-radius: 99px; font-size: 12px; font-weight: 600; background: rgba(120, 200, 255, .24); color: #d8ecff; border: 1px solid rgba(190, 225, 255, .25); }
.badge.soft { background: rgba(255, 255, 255, .1); color: #c3dcff; font-weight: 600; }

/* ---------- การ์ดเป้าหมายอันดับแรก ---------- */
.hero {
  width: 100%;
  border-radius: 42px;
  padding: 16px 18px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  transition: transform .2s ease;
}
.hero-head { width: 100%; display: flex; align-items: center; gap: 10px; }
.hero-name { flex: 1; min-width: 0; font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill {
  flex: none;
  padding: 5px 14px; border-radius: 99px;
  font-size: 13px; font-weight: 600;
  background: var(--c, var(--blue)); color: #fff;
}
.pill.ok { background: linear-gradient(135deg, #4cc3ff, #1f6bff); }
.ring-wrap { position: relative; width: 172px; height: 172px; }
.ring { width: 100%; height: 100%; display: block; }
.ring-bg { stroke: rgba(15, 60, 160, .1); }
.ring-fg { transition: stroke-dashoffset 1s cubic-bezier(.2, .8, .2, 1), stroke-opacity .3s; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px; }
.rc-num { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; }
.rc-sub { font-size: 12.5px; color: var(--ink2); }
.hero-foot { padding: 7px 18px; border-radius: 99px; background: rgba(255, 255, 255, .62); border: 1px solid rgba(255, 255, 255, .85); font-size: 13.5px; font-weight: 600; color: var(--ink2); }

/* ---------- ไอคอนวงกลมประจำเป้าหมาย ---------- */
.dot {
  flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c, var(--blue)) center / cover no-repeat;
  color: #fff; font-weight: 600; line-height: 1;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .6);
}
.dot.has-photo { color: transparent; }

/* ---------- แถวแคปซูน ---------- */
.cap-title { font-size: 13px; font-weight: 500; color: var(--navy); opacity: .72; padding: 6px 8px 0; }
.caps { display: flex; flex-direction: column; gap: 10px; }
.cap {
  width: 100%;
  border-radius: 999px;
  padding: 9px 20px 9px 9px;
  display: flex; align-items: center; gap: 12px;
  transition: transform .2s ease;
}
.mini { position: relative; width: 52px; height: 52px; flex: none; }
.mini .ring { position: absolute; inset: 0; }
.mini .dot { position: absolute; inset: 0; margin: auto; }
.cap-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cap-name { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap-sub { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap-pct { font-size: 16px; font-weight: 600; flex: none; }
.e-amt { font-weight: 600; flex: none; }
.e-amt.pos { color: var(--good); }
.e-amt.neg { color: var(--danger); }

/* ---------- หน้าว่าง ---------- */
.empty { border-radius: 42px; padding: 26px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.coin {
  width: 84px; height: 84px; border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, #ffffff, #8fd3ff 48%, #1f6bff);
  box-shadow: 0 6px 14px rgba(31, 107, 255, .3);
}
.empty h2 { font-size: 19px; font-weight: 600; color: var(--navy); }
.empty p { color: var(--ink2); max-width: 30ch; }
.tpls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.chip.tp {
  height: auto; min-height: 58px; padding: 8px 12px; border-radius: 29px;
  flex-direction: column; justify-content: center; gap: 0;
  white-space: normal; text-align: center; line-height: 1.3;
}
.chip.tp .amt { font-size: 12.5px; }

/* ---------- แถบแท็บลอย ---------- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  width: min(100%, 480px); margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
#dock > * { pointer-events: auto; }
.tabs { position: relative; flex: 1; max-width: 290px; height: 66px; border-radius: 33px; padding: 5px; display: grid; grid-template-columns: 1fr 1fr; }
.tab-ind {
  position: absolute; top: 5px; bottom: 5px; left: 5px;
  width: calc(50% - 5px); border-radius: 28px;
  background: linear-gradient(160deg, rgba(255, 255, 255, .95), rgba(225, 241, 255, .75));
  box-shadow: 0 2px 8px rgba(15, 70, 190, .18);
  transition: transform .3s ease;
  z-index: -1;
}
#dock[data-tab="history"] .tab-ind { transform: translateX(100%); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 28px; color: var(--ink2); font-size: 11.5px; font-weight: 600; text-align: center; transition: color .25s; }
.tab.on { color: var(--blue-deep); }
.add {
  position: relative;
  width: 66px; height: 66px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  color: #fff;
  background: linear-gradient(150deg, #4fb4ff, #1f6bff);
  border: 1px solid rgba(255, 255, 255, .55);
  box-shadow: 0 6px 14px rgba(31, 107, 255, .4);
  transition: transform .22s ease;
}
.round:active, .hero:active, .cap:active, .add:active, .key:active, .btn:active, .chip:active { transform: scale(.94); }
button:focus-visible, .input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- แผ่นล่าง ---------- */
#sheet { position: fixed; inset: 0; z-index: 30; }
.backdrop { position: absolute; inset: 0; background: rgba(5, 25, 80, .36); opacity: 0; transition: opacity .28s; }
.panel {
  position: absolute; left: 0; right: 0; bottom: 0;
  width: min(100%, 480px); margin: 0 auto;
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 38px 38px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: #f3f9ff;
  border: 1px solid rgba(255, 255, 255, .9); border-bottom: 0;
  box-shadow: 0 -6px 24px rgba(5, 40, 140, .22);
  transform: translateY(105%);
  transition: transform .42s cubic-bezier(.2, .9, .25, 1);
}
#sheet.open .panel { transform: none; }
.grab { width: 42px; height: 5px; border-radius: 5px; background: rgba(15, 60, 160, .2); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 21px; font-weight: 600; overflow-wrap: anywhere; color: var(--navy); }
.sheet-head .sub { font-size: 13px; color: var(--ink2); font-weight: 500; display: block; }
.stack { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.stack h3 { font-size: 13px; font-weight: 500; color: var(--ink2); padding-left: 6px; margin-top: 4px; }
.frost-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 24px; line-height: 1; color: var(--navy); background: rgba(255, 255, 255, .78); border: 1px solid rgba(255, 255, 255, .98); box-shadow: inset 0 1px 0 #fff, 0 3px 10px rgba(15, 70, 190, .14); text-align: center; }

.big { font-size: clamp(36px, 11vw, 46px); font-weight: 600; letter-spacing: -.02em; line-height: 1.12; overflow-wrap: anywhere; color: var(--navy); }
.big small { font-size: .55em; color: var(--blue); margin-right: 3px; }
.bar { height: 16px; border-radius: 99px; background: rgba(15, 60, 160, .1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 50%, #bfe6ff)); transition: width .9s cubic-bezier(.2, .8, .2, 1); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .55); }
.note { font-size: 13px; color: var(--ink2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- ปุ่ม/ช่องกรอก ---------- */
.btn {
  height: 56px; padding: 0 24px; border-radius: 999px;
  font-weight: 600; font-size: 16px; text-align: center;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .2s ease, opacity .2s;
}
.btn.primary { color: #fff; background: linear-gradient(150deg, #4fb4ff, #1f6bff); box-shadow: 0 6px 14px rgba(31, 107, 255, .35); }
.btn.soft { color: var(--navy); background: rgba(255, 255, 255, .72); border: 1px solid rgba(255, 255, 255, .98); box-shadow: inset 0 1px 0 #fff, 0 4px 14px rgba(15, 70, 190, .12); }
.btn.danger { color: var(--danger); background: rgba(255, 255, 255, .72); border: 1px solid rgba(255, 255, 255, .98); }
.btn[disabled] { opacity: .5; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink2); padding-left: 8px; }
.input {
  width: 100%; height: 54px; padding: 0 20px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .8); border: 1px solid rgba(255, 255, 255, .98);
  box-shadow: inset 0 1px 3px rgba(15, 70, 190, .12);
  font-size: 17px;
}
.input::placeholder { color: var(--ink3); }
textarea.input { height: 96px; border-radius: 26px; padding: 12px 18px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; resize: none; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }

.pick { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.pick::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 16px 0 7px; border-radius: 999px;
  background: rgba(255, 255, 255, .68); border: 1px solid rgba(255, 255, 255, .98);
  box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(15, 70, 190, .08);
  font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--navy);
  transition: transform .2s ease, background .2s;
}
.chip.q { padding: 0 16px; height: 38px; }
.chip.t { padding: 0 16px; }
.chip.on { background: rgba(31, 107, 255, .18); border-color: rgba(31, 107, 255, .6); color: var(--blue-deep); }
.chip .amt { color: var(--ink2); font-weight: 600; }
.qrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 48px; padding: 4px; border-radius: 999px; background: rgba(15, 60, 160, .1); }
.seg i { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: #fff; box-shadow: 0 2px 8px rgba(15, 70, 190, .22); transition: transform .38s ease; }
.seg[data-mode="out"] i { transform: translateX(100%); }
.seg button { position: relative; z-index: 1; text-align: center; font-weight: 600; border-radius: 999px; color: var(--ink2); transition: color .2s; }
.seg button.on { color: var(--blue-deep); }

.disp { text-align: center; font-size: clamp(44px, 14vw, 58px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; overflow-wrap: anywhere; color: var(--navy); }
.disp small { font-size: .5em; color: var(--blue); margin-right: 4px; }
.disp.empty span { color: var(--ink3); }
.disp-sub { text-align: center; font-size: 13px; color: var(--ink2); margin-top: -8px; }
.pad { display: grid; grid-template-columns: repeat(3, 68px); justify-content: center; gap: 12px 24px; }
.key {
  width: 68px; height: 68px; border-radius: 50%;
  display: grid; place-items: center; text-align: center;
  font-size: 27px; font-weight: 400; color: var(--navy);
  background: linear-gradient(160deg, rgba(255, 255, 255, .95), rgba(232, 244, 255, .7));
  border: 1px solid rgba(255, 255, 255, .98);
  box-shadow: inset 0 1.5px 0 #fff, 0 5px 14px rgba(15, 70, 190, .16);
  transition: transform .18s ease, background .15s;
}
.key:active { background: rgba(170, 215, 255, .95); }
.key.sub { font-size: 22px; color: var(--ink2); }

.swatches { display: flex; gap: 12px; flex-wrap: wrap; padding-left: 4px; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .98); box-shadow: 0 0 0 1px rgba(15, 60, 160, .14), 0 3px 8px rgba(15, 70, 190, .22); transition: transform .2s ease; }
.sw.on { box-shadow: 0 0 0 3px var(--navy); transform: scale(1.1); }
.photo-pick { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: rgba(255, 255, 255, .75) center / cover no-repeat; border: 1.5px dashed rgba(31, 107, 255, .55); color: var(--blue); }
.photo-pick.has { border-style: solid; border-color: rgba(255, 255, 255, .98); box-shadow: 0 6px 18px rgba(15, 70, 190, .3); color: transparent; }
.photo-actions { display: flex; gap: 8px; justify-content: center; }

.entries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.entry { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid rgba(15, 60, 160, .1); }
.entry:last-child { border-bottom: 0; }
.e-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.e-note { font-weight: 600; overflow-wrap: anywhere; }
.e-date { font-size: 12px; color: var(--ink2); }
.entry .frost-btn { width: 36px; height: 36px; font-size: 20px; }

/* ---------- ฉลอง/แจ้งเตือน ---------- */
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; display: none; }
#toast {
  position: fixed; left: 50%; z-index: 50;
  top: calc(14px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -16px) scale(.96);
  max-width: calc(100% - 32px);
  padding: 11px 20px; border-radius: 999px;
  background: rgba(8, 28, 84, .94); color: #eaf5ff;
  border: 1px solid rgba(160, 205, 255, .35);
  font-size: 14px; font-weight: 600; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .35s ease;
}
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<main id="app"></main>

<nav id="dock" data-tab="home" data-ta="menu_aria" aria-label="เมนูหลัก">
  <div class="tabs glass" role="tablist">
    <i class="tab-ind"></i>
    <button class="tab on" data-action="tab" data-tab="home" role="tab" aria-selected="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
      <span data-t="tab_home">หน้าหลัก</span>
    </button>
    <button class="tab" data-action="tab" data-tab="history" role="tab" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-t="tab_history">ประวัติ</span>
    </button>
  </div>
  <button class="add" data-action="deposit" data-ta="deposit_word" aria-label="ฝากเงิน">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</nav>

<div id="sheet" hidden>
  <div class="backdrop" data-action="close"></div>
  <div class="panel" role="dialog" aria-modal="true">
    <div class="grab" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </div>

  /* ---------- ตัวช่วย ---------- */
  const NF = {};
  function numFmt() {

  function dateLabel(ts) {

    if (d.getFullYear() !== new Date().getFullYear()) opt.year = '2-digit';
    return d.toLocaleDateString(locale(), opt);
  }
  function dayLabel(ts) {
    const d = new Date(ts), now = new Date();
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, now)) return t('today');
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (same(d, y)) return t('yesterday');
    return dateLabel(ts);
  }

  /* ---------- ข้อมูลในเครื่อง ---------- */
  function sanitize(raw) {
    const out = { goals: [] };
    if (!raw || !Array.isArray(raw.goals)) return out;
    for (const g of raw.goals) {
      if (!g || typeof g.name !== 'string' || !(Number(g.target) > 0)) continue;
      const entries = (Array.isArray(g.entries) ? g.entries : [])
        .filter(e => e && Number.isFinite(Number(e.amt)) && Number(e.amt) !== 0)
        .map(e => ({
          id: typeof e.id === 'string' ? e.id : uid(),
          amt: round2(Number(e.amt)),
          note: typeof e.note === 'string' ? e.note.slice(0, 60) : '',
          ts: Number.isFinite(Number(e.ts)) ? Number(e.ts) : Date.now(),
        }));
      out.goals.push({
        id: typeof g.id === 'string' ? g.id : uid(),
        name: g.name.slice(0, 40),
        target: round2(Number(g.target)),
        color: Number.isInteger(g.color) ? g.color : 0,
        createdAt: Number.isFinite(Number(g.createdAt)) ? Number(g.createdAt) : Date.now(),
        entries,
      });
    }
    return out;
  }
  function load() {
    try { return sanitize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return { goals: [] }; }
  }
  let state = load();
  function save() {

  /* ---------- รูปประจำเป้าหมาย (เก็บแยกในเครื่อง) ---------- */
  const photoCache = new Map();
  function getPhoto(id) {
    if (photoCache.has(id)) return photoCache.get(id);
    let v = null;
    try { v = localStorage.getItem(PHOTO_PREFIX + id); } catch (e) { /* ไม่เป็นไร */ }
    photoCache.set(id, v);
    return v;
  }
  function setPhoto(id, url) {
    try {
      if (url) localStorage.setItem(PHOTO_PREFIX + id, url); else localStorage.removeItem(PHOTO_PREFIX + id);
      photoCache.set(id, url || null);
      return true;
    } catch (e) { return false; }
  }
  function prunePhotos() {
    try {
      const ids = new Set(state.goals.map(g => g.id));
      Object.keys(localStorage).filter(k => k.startsWith(PHOTO_PREFIX)).forEach(k => {
        const id = k.slice(PHOTO_PREFIX.length);
        if (!ids.has(id)) { localStorage.removeItem(k); photoCache.delete(id); }
      });
    } catch (e) { /* ไม่เป็นไร */ }
  }
  function readPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const M = 320, s = Math.min(1, M / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s));
        c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  /* ---------- สถานะหน้าจอ ---------- */
  let tab = 'home';
  let view = null;

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  /* ---------- ตัวเลขวิ่งนับเพิ่ม + วงแหวน ---------- */
  const shown = new Map();
  const ringShown = new Map();

  function countUp(el) {
    const to = Number(el.dataset.count), key = el.dataset.key || '';
    const from = shown.has(key) ? shown.get(key) : 0;
    shown.set(key, to);
    const pre = el.dataset.pre || '';
    const fmt = el.dataset.fmt === 'pct'
      ? v => Math.floor(v * 100) + '%'
      : (v, last) => nf.format(last ? v : Math.round(v));
    if (reduce || from === to) { el.textContent = pre + fmt(to, true); return; }
    const t0 = performance.now(), dur = 750;
    const step = ts => {
      const k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = pre + fmt(k < 1 ? from + (to - from) * e : to, k >= 1);
      if (k < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function ring(pct, color, size, stroke, key) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const from = ringShown.has(key) ? ringShown.get(key) : 0;
    ringShown.set(key, pct);
    const off = v => (c * (1 - v)).toFixed(2);
    return `<svg class="ring" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="ring-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}"
        style="stroke-dashoffset:${off(from)};stroke-opacity:${from > 0 ? 1 : 0}"
        data-to="${off(pct)}" data-op="${pct > 0 ? 1 : 0}"
        transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>`;
  }

  function post(root = document) {
    $$('[data-photo]', root).forEach(el => {
      const url = getPhoto(el.dataset.photo);
      if (url) { el.style.backgroundImage = `url("${url}")`; el.classList.add('has-photo'); }
    });
    $$('[data-count]', root).forEach(countUp);
    const rings = $$('.ring-fg', root);
    if (rings.length) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        rings.forEach(el => { el.style.strokeDashoffset = el.dataset.to; el.style.strokeOpacity = el.dataset.op; });
      }));
    }
  }

  /* ---------- ฉลองเมื่อถึงเป้า ---------- */
  function confetti() {
    try { if (navigator.vibrate) navigator.vibrate([30, 40, 30]); } catch (e) { /* ไม่เป็นไร */ }
    if (reduce) return;
    const c = $('#confetti'), ctx = c.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.display = 'block';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#1f6bff', '#4cc3ff', '#ffffff', '#bfe3ff', '#0b2a6b', '#7aa7ff'];
    const P = Array.from({ length: 70 }, () => ({
      x: W / 2 + (Math.random() - .5) * 80, y: H * .58,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 15 - 5,
      s: 6 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
      c: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < .45,
    }));
    const t0 = performance.now();
    (function frame(ts) {
      ctx.clearRect(0, 0, W, H);
      let alive = false;
      for (const p of P) {
        p.vy += .34; p.x += p.vx; p.y += p.vy; p.vx *= .991; p.r += p.vr;
        if (p.y < H + 20) alive = true;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 6.283); ctx.fill(); }
        else ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
        ctx.restore();
      }
      if (alive && ts - t0 < 2800) requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, W, H); c.style.display = 'none'; }
    })(t0);
  }

  /* ---------- ส่วนประกอบ ---------- */
  function sortedGoals() {
    return [...state.goals].sort((a, b) => {
      const da = sumSaved(a) >= a.target, db = sumSaved(b) >= b.target;
      return da === db ? a.createdAt - b.createdAt : da ? 1 : -1;
    });
  }
  const featured = () => sortedGoals()[0] || null;

  function dot(g, size) {
    return `<span class="dot" data-photo="${esc(g.id)}" style="--c:${colorOf(g)};width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${esc(initialOf(g))}</span>`;
  }

  function topBar(title) {
    const cur = langFrom || lang;
    return `<header class="top">
      <h1>${esc(title)}</h1>
      <div class="top-r">
        <div class="lang glass" data-lang="${cur}" role="group" aria-label="${esc(t('lang_aria'))}">
          <i></i>
          <button data-action="lang" data-v="th" class="${cur === 'th' ? 'on' : ''}" aria-pressed="${lang === 'th'}">ไทย</button>
          <button data-action="lang" data-v="en" class="${cur === 'en' ? 'on' : ''}" aria-pressed="${lang === 'en'}">EN</button>
        </div>
        <button class="round glass" data-action="settings" aria-label="${esc(t('settings_aria'))}">${ICON.gear}</button>
      </div>
    </header>`;
  }

  function heroCard(g) {
    const s = sumSaved(g), p = pctOf(g), col = colorOf(g), done = s >= g.target, left = round2(g.target - s);
    const len = money(s).length, fs = len <= 9 ? 24 : len <= 11 ? 20 : len <= 13 ? 17 : 14;
    return `<button class="hero glass" data-action="open" data-id="${esc(g.id)}" style="--c:${col}">
      <span class="hero-head">${dot(g, 40)}<span class="hero-name">${esc(g.name)}</span>
        ${done ? `<span class="pill ok">${t('done')}</span>`
          : `<span class="pill" data-count="${p}" data-fmt="pct" data-key="pct:${esc(g.id)}">${Math.floor(p * 100)}%</span>`}
      </span>
      <span class="ring-wrap">${ring(p, col, 172, 14, 'r:' + g.id)}
        <span class="ring-center">
          <span class="rc-num" style="font-size:${fs}px" data-count="${s}" data-pre="฿" data-key="s:${esc(g.id)}">${money(s)}</span>
          <span class="rc-sub">${t('of', money(g.target))}</span>
        </span>
      </span>
      <span class="hero-foot">${done ? t('reached') : t('left', money(left))}</span>
    </button>`;
  }

  function capRow(g) {
    const s = sumSaved(g), p = pctOf(g), col = colorOf(g), done = s >= g.target;
    return `<button class="cap glass" data-action="open" data-id="${esc(g.id)}" style="--c:${col}">
      <span class="mini">${ring(p, col, 52, 5, 'm:' + g.id)}${dot(g, 36)}</span>
      <span class="cap-info"><span class="cap-name">${esc(g.name)}</span><span class="cap-sub">${money(s)} ${t('of', money(g.target))}</span></span>
      ${done ? `<span class="pill ok">${t('done')}</span>` : `<span class="cap-pct" style="color:${col}">${Math.floor(p * 100)}%</span>`}
    </button>`;
  }

  function emptyState() {
    return `<section class="empty glass">
      <div class="coin" aria-hidden="true"></div>
      <h2>${t('empty_title')}</h2>
      <p>${t('empty_body')}</p>
      <div class="tpls">${TEMPLATES.map((tp, i) => `<button class="chip tp" data-action="tpl" data-i="${i}">${esc(t(tp.k))}<span class="amt">${money(tp.t)}</span></button>`).join('')}</div>
      <button class="btn soft" data-action="new">${t('custom_goal')}</button>

  /* ---------- หน้าหลัก / ประวัติ ---------- */
  function renderHome() {
    const goals = sortedGoals();
    const total = round2(goals.reduce((a, g) => a + sumSaved(g), 0));
    const now = new Date();
    const m0 = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const month = round2(goals.flatMap(g => g.entries).filter(e => e.ts >= m0).reduce((a, e) => a + e.amt, 0));
    const done = goals.filter(g => sumSaved(g) >= g.target).length;
    const [first, ...rest] = goals;
    $('#app').innerHTML = `<div class="wrap">
      ${topBar(t('app'))}
      <section class="total glass deep">
        <div class="lbl">${t('total_label')}</div>
        <div class="num"><small>฿</small><span data-count="${total}" data-key="total">${nf.format(total)}</span></div>
        <div class="chips-row">
          <span class="badge">${t('this_month', (month >= 0 ? '+' : '−') + money(Math.abs(month)))}</span>
          <span class="badge soft">${t('goals_count', goals.length, done)}</span>
        </div>
      </section>
      ${first ? heroCard(first) : emptyState()}
      ${rest.length ? `<div class="cap-title">${t('other_goals')}</div><div class="caps">${rest.map(capRow).join('')}</div>` : ''}
    </div>`;
  }

  function renderHistory() {
    const rows = state.goals.flatMap(g => g.entries.map(e => ({ g, e }))).sort((a, b) => b.e.ts - a.e.ts).slice(0, 300);
    let html = '', last = '';
    for (const { g, e } of rows) {
      const lbl = dayLabel(e.ts);
      if (lbl !== last) { html += `${last ? '</div>' : ''}<div class="cap-title">${esc(lbl)}</div><div class="caps">`; last = lbl; }
      html += `<button class="cap glass" data-action="open" data-id="${esc(g.id)}" style="--c:${colorOf(g)}">
        ${dot(g, 44)}
        <span class="cap-info"><span class="cap-name">${esc(entryLabel(e))}</span><span class="cap-sub">${esc(g.name)} · ${timeLabel(e.ts)}</span></span>
        <span class="e-amt ${e.amt > 0 ? 'pos' : 'neg'}">${e.amt > 0 ? '+' : '−'}${nf.format(Math.abs(e.amt))}</span>
      </button>`;
    }
    if (last) html += '</div>';
    $('#app').innerHTML = `<div class="wrap">
      ${topBar(t('history'))}
      ${html || `<section class="empty glass"><div class="coin" aria-hidden="true"></div><h2>${t('hist_empty_title')}</h2><p>${t('hist_empty_body')}</p></section>`}
    </div>`;

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('app');
    $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    $$('[data-ta]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ta)); });
  }

  function render(enter) {
    if (tab === 'home') renderHome(); else renderHistory();
    if (enter) $('.wrap').classList.add('enter');
    post($('#app'));
  }

  function setLang(v) {
    if (v === lang || (v !== 'th' && v !== 'en')) return;
    langFrom = lang;
    lang = v;
    try { localStorage.setItem(LKEY, v); } catch (e) { /* ไม่เป็นไร */ }
    applyLang();
    render();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      langFrom = null;
      $$('.lang').forEach(el => {
        el.dataset.lang = lang;
        $$('button', el).forEach(b => {
          const on = b.dataset.v === lang;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      });
    }));
  }

  function setTab(tb) {
    if (tb === tab) return;
    tab = tb;
    $('#dock').dataset.tab = tb;
    $$('#dock .tab').forEach(b => {
      const on = b.dataset.tab === tb;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    window.scrollTo(0, 0);
    render(true);
  }

  /* ---------- แผ่นล่าง ---------- */
  function openSheet(html) {
    const sheet = $('#sheet');
    const first = sheet.hidden;
    $('#sheet-body').innerHTML = html;
    post($('#sheet-body'));
    if (first) {
      sheet.hidden = false;
      try { history.pushState({ sheet: 1 }, ''); } catch (e) { /* ไม่เป็นไร */ }
      requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
    } else {
      $('.panel').scrollTop = 0;
    }
  }
  function hideSheet() {
    const sheet = $('#sheet');
    if (sheet.hidden) return;
    sheet.classList.remove('open');
    view = null;
    setTimeout(() => { if (!sheet.classList.contains('open')) { sheet.hidden = true; $('#sheet-body').innerHTML = ''; } }, 450);
  }
  function closeSheet() {
    if (history.state && history.state.sheet) history.back(); else hideSheet();
  }
  window.addEventListener('popstate', hideSheet);

  /* ---------- รายละเอียดเป้าหมาย ---------- */
  function showGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return closeSheet();
    view = { type: 'goal', id };
    const s = sumSaved(g), p = pctOf(g), left = round2(g.target - s), col = colorOf(g);
    const rows = [...g.entries].sort((a, b) => b.ts - a.ts).map(e => `
      <li class="entry">
        <div class="e-main">
          <span class="e-note">${esc(entryLabel(e))}</span>
          <span class="e-date">${dateLabel(e.ts)} · ${timeLabel(e.ts)}</span>
        </div>
        <span class="e-amt ${e.amt > 0 ? 'pos' : 'neg'}">${e.amt > 0 ? '+' : '−'}${nf.format(Math.abs(e.amt))}</span>
        <button class="frost-btn" data-action="delentry" data-id="${esc(e.id)}" aria-label="${esc(t('del_entry_aria'))}">×</button>
      </li>`).join('');

    openSheet(`
      <div class="sheet-head">
        ${dot(g, 52)}
        <h2>${esc(g.name)}<span class="sub">${t('goal_target', money(g.target))}</span></h2>
        <button class="frost-btn" data-action="close" aria-label="${esc(t('close'))}">×</button>
      </div>
      <div class="stack" style="--c:${col}">
        <div class="big"><small>฿</small><span data-count="${s}" data-key="gs:${esc(g.id)}">${nf.format(s)}</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(p * 100)}"><i style="width:${(p * 100).toFixed(1)}%"></i></div>
        <p class="note">${left > 0 ? `${t('left', money(left))} · ${Math.floor(p * 100)}%` : t('reached')}</p>
        <div class="row2">
          <button class="btn primary" data-action="depo" data-id="${esc(g.id)}" data-mode="in">${t('deposit_word')}</button>
          <button class="btn soft" data-action="depo" data-id="${esc(g.id)}" data-mode="out">${t('withdraw_word')}</button>
        </div>
        <h3>${t('history_of_goal')}</h3>
        ${rows ? `<ul class="entries">${rows}</ul>` : `<p class="note" style="padding-left:6px">${t('no_entries')}</p>`}
        <div class="row2">
          <button class="btn soft" data-action="edit" data-id="${esc(g.id)}">${t('edit')}</button>
          <button class="btn danger" data-action="delgoal" data-id="${esc(g.id)}">${t('del_goal')}</button>
        </div>
      </div>`);
  }

  /* ---------- ฝาก/ถอน ด้วยแผงตัวเลข ---------- */
  function showDeposit(goalId, mode, from) {
    const goals = sortedGoals();
    if (!goals.length) { showEdit(); return; }
    const g = goals.find(x => x.id === goalId) || goals[0];
    view = { type: 'dep', goalId: g.id, mode: mode || 'in', amt: '', from: from || null };
    const chips = goals.length > 1
      ? `<div class="pick" id="pick">${goals.map(x => `<button class="chip" data-action="pick" data-id="${esc(x.id)}" style="--c:${colorOf(x)}">${dot(x, 28)}${esc(x.name)}</button>`).join('')}</div>`
      : '';
    openSheet(`
      <div class="sheet-head">
        ${view.from ? `<button class="frost-btn" data-action="open" data-id="${esc(view.from)}" aria-label="${esc(t('back'))}">${ICON.back}</button>` : ''}
        <h2 id="dep-title">${t('deposit_word')}</h2>
        <button class="frost-btn" data-action="close" aria-label="${esc(t('close'))}">×</button>
      </div>
      <div class="stack">
        <div class="seg" id="seg" data-mode="in">
          <i></i>
          <button data-action="mode" data-v="in">${t('dep_short')}</button>
          <button data-action="mode" data-v="out">${t('wd_short')}</button>
        </div>
        ${chips}
        <div class="disp empty" id="disp"><small>฿</small><span id="disp-n">0</span></div>
        <div class="disp-sub" id="dsub"></div>
        <div class="qrow">
          <button class="chip q" data-action="quick" data-v="100">+100</button>
          <button class="chip q" data-action="quick" data-v="500">+500</button>
          <button class="chip q" data-action="quick" data-v="1000">+1,000</button>
          <button class="chip q" data-action="quick" data-v="5000">+5,000</button>
        </div>
        <div class="pad">
          ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button class="key" data-action="key" data-k="${k}">${k}</button>`).join('')}
          <button class="key sub" data-action="key" data-k=".">.</button>
          <button class="key" data-action="key" data-k="0">0</button>
          <button class="key sub" data-action="key" data-k="del" aria-label="${esc(t('del_digit_aria'))}">${ICON.del}</button>
        </div>
        <input class="input" id="note" type="text" maxlength="60" placeholder="${esc(t('note_ph'))}" aria-label="${esc(t('note_aria'))}">
        <button class="btn primary" id="confirm" data-action="confirm" disabled>${t('dep_short')}</button>
      </div>`);
    refreshDep();
  }

  function dispFmt(a) {
    if (!a) return '0';
    const [i, d] = a.split('.');
    const int = nf.int(Number(i || 0));
    return d === undefined ? int : int + '.' + d;
  }

  function refreshDep() {
    if (!view || view.type !== 'dep') return;
    const g = state.goals.find(x => x.id === view.goalId);
    if (!g) return;
    const out = view.mode === 'out';
    const n = Number(view.amt) || 0;
    $('#seg').dataset.mode = view.mode;
    $$('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v === view.mode));
    $('#dep-title').textContent = out ? t('withdraw_word') : t('deposit_word');
    $('#disp-n').textContent = dispFmt(view.amt);
    $('#disp').classList.toggle('empty', !view.amt);
    $('#dsub').textContent = t('dep_current', g.name, money(sumSaved(g)));
    $$('#pick .chip').forEach(c => c.classList.toggle('on', c.dataset.id === view.goalId));
    const btn = $('#confirm');
    const word = out ? t('wd_short') : t('dep_short');
    btn.disabled = !(n > 0);
    btn.textContent = n > 0 ? `${word} ${money(n)}` : word;
    btn.className = 'btn ' + (out ? 'soft' : 'primary');
  }

  function pressKey(k) {
    let a = view.amt;
    if (k === 'del') a = a.slice(0, -1);
    else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; }
    else if (a === '0') a = k;
    else {
      const [i, d] = a.split('.');
      if (d !== undefined) { if (d.length >= 2) return; } else if (i.length >= 9) return;
      a += k;
    }
    view.amt = a;
    refreshDep();
  }

  function confirmDep() {
    if (!view || view.type !== 'dep') return;
    const g = state.goals.find(x => x.id === view.goalId);
    if (!g) return;
    const sign = view.mode === 'out' ? -1 : 1;
    const raw = Number(view.amt);
    if (!(raw > 0)) return toast(t('enter_amount'));
    if (raw > MAX_AMOUNT) return toast(t('amount_big'));
    const amt = round2(raw * sign);
    if (amt === 0) return toast(t('amount_small'));
    const before = sumSaved(g);
    if (sign < 0 && -amt > before + 1e-9) return toast(t('over_withdraw'));
    g.entries.push({ id: uid(), amt, note: ($('#note').value || '').trim().slice(0, 60), ts: Date.now() });
    save();
    const reached = sign > 0 && before < g.target && sumSaved(g) >= g.target;
    const from = view.from;
    if (from) { render(); showGoal(g.id); } else { closeSheet(); render(); }
    if (reached) { toast(t('reached_toast')); confetti(); }
    else toast(sign > 0 ? t('deposited') : t('withdrawn'));
  }

  /* ---------- สร้าง/แก้ไขเป้าหมาย ---------- */
  function photoPreviewStyle() {
    if (!view) return '';
    const url = view.photo === undefined ? (view.id ? getPhoto(view.id) : null) : view.photo;
    return url ? `background-image:url("${url}")` : '';
  }

    const g = id ? state.goals.find(x => x.id === id) : null;
    view = { type: 'edit', id: g ? g.id : null, color: g ? g.color % COLORS.length : state.goals.length % COLORS.length, photo: undefined };
    const has = !!photoPreviewStyle();
    openSheet(`
      <div class="sheet-head">
        <h2>${g ? t('edit_goal') : t('new_goal')}</h2>
        <button class="frost-btn" data-action="close" aria-label="${esc(t('close'))}">×</button>
      </div>
      <div class="stack">
        <button class="photo-pick ${has ? 'has' : ''}" id="photo-pick" data-action="pickphoto" style="${photoPreviewStyle()}" aria-label="${esc(t('photo_aria'))}">${has ? '' : ICON.camera}</button>
        <div class="photo-actions">
          <button class="chip t" id="photo-btn" data-action="pickphoto">${has ? t('change_photo') : t('add_photo')}</button>
          <button class="chip t" id="rm-photo" data-action="rmphoto" ${has ? '' : 'hidden'}>${t('remove_photo')}</button>

        <input id="g-file" type="file" accept="image/*" hidden>

          <label for="g-name">${t('goal_name')}</label>
          <input class="input" id="g-name" type="text" maxlength="40" placeholder="${esc(t('goal_name_ph'))}" value="${g ? esc(g.name) : ''}">
        </div>
        <div class="field">
          <label for="g-target">${t('target_label')}</label>
          <input class="input" id="g-target" type="number" inputmode="decimal" min="0" step="any" placeholder="30000" value="${g ? g.target : ''}">
        </div>
        ${g ? '' : `<div class="field">
          <label for="g-init">${t('init_label')}</label>
          <input class="input" id="g-init" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </div>`}
        <div class="field">
          <label>${t('color_label')}</label>
          <div class="swatches">
            ${COLORS.map((c, i) => `<button class="sw ${i === view.color ? 'on' : ''}" data-action="color" data-i="${i}" style="background:${c}" aria-label="${esc(t('color_aria', i + 1))}"></button>`).join('')}
          </div>
        </div>
        <div class="row2">
          <button class="btn soft" data-action="${g ? 'open' : 'close'}" data-id="${g ? esc(g.id) : ''}">${t('cancel')}</button>
          <button class="btn primary" data-action="savegoal">${t('save_btn')}</button>
        </div>
      </div>`);
  }

  function updatePhotoPreview() {
    const pick = $('#photo-pick'); if (!pick) return;
    const style = photoPreviewStyle();
    pick.style.backgroundImage = style ? style.replace('background-image:', '') : '';
    pick.classList.toggle('has', !!style);
    pick.innerHTML = style ? '' : ICON.camera;
    const rm = $('#rm-photo'); if (rm) rm.hidden = !style;
    const pb = $('#photo-btn'); if (pb) pb.textContent = style ? t('change_photo') : t('add_photo');
  }

  async function onFile(file) {
    if (!file || !view || view.type !== 'edit') return;
    try {
      view.photo = await readPhoto(file);
      updatePhotoPreview();
    } catch (e) { toast(t('photo_fail')); }
  }

  function createGoal(name, target, init) {
    const g = { id: uid(), name, target: round2(target), color: state.goals.length % COLORS.length, createdAt: Date.now(), entries: [] };
    if (init > 0 && init <= MAX_AMOUNT) g.entries.push({ id: uid(), amt: round2(init), note: '@init', ts: Date.now() });
    state.goals.push(g);
    return g;
  }

  function saveGoal() {
    if (!view || view.type !== 'edit') return;
    const name = $('#g-name').value.trim();
    const target = Number($('#g-target').value);
    if (!name) return toast(t('name_first'));
    if (!(target > 0)) return toast(t('target_pos'));
    if (target > MAX_AMOUNT) return toast(t('target_big'));
    let g = view.id ? state.goals.find(x => x.id === view.id) : null;
    if (g) { g.name = name; g.target = round2(target); g.color = view.color; }
    else {
      g = createGoal(name, target, Number($('#g-init') ? $('#g-init').value : 0));
      g.color = view.color;
    }
    if (view.photo !== undefined && !setPhoto(g.id, view.photo)) toast(t('photo_full'));
    save();
    render();
    showGoal(g.id);
    if (!$('#toast').classList.contains('show')) toast(t('saved'));
  }

    view = { type: 'settings' };
    openSheet(`
      <div class="sheet-head">

      <div class="stack">
        <p class="note" style="padding:0 6px">${t('backup_note')}</p>
        <div class="field">
          <label for="backup">${t('your_backup')}</label>
          <textarea class="input" id="backup" readonly></textarea>
        </div>
        <button class="btn primary" data-action="copybackup">${t('copy_backup')}</button>

  function arm(btn, text) {
    if (btn.dataset.armed) return true;
    btn.dataset.armed = '1';
    btn.dataset.orig = btn.textContent;
    btn.textContent = text;
    setTimeout(() => {
      if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; }
    }, 3000);
    return false;
  }

  async function copyBackup() {
    const ta = $('#backup');
    try { await navigator.clipboard.writeText(ta.value); toast(t('copied')); }
    catch (e) { ta.focus(); ta.select(); toast(t('copy_fail')); }
  }

  function restore(btn) {
    const txt = $('#restore').value.trim();
    if (!txt) return toast(t('paste_first'));
    let parsed;
    try { parsed = JSON.parse(txt); } catch (e) { return toast(t('bad_backup')); }
    if (!parsed || !Array.isArray(parsed.goals)) return toast(t('bad_backup'));
    const clean = sanitize(parsed);
    if (!arm(btn, t('tap_confirm'))) return;
    state = clean;
    save(); prunePhotos(); closeSheet(); render();
    toast(t('restored', clean.goals.length));
  }

  /* ---------- จัดการการกด ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case 'tab': setTab(el.dataset.tab); break;
      case 'lang': setLang(el.dataset.v); break;
      case 'deposit': showDeposit(null, 'in', null); break;
      case 'depo': showDeposit(id, el.dataset.mode, id); break;
      case 'mode': view.mode = el.dataset.v; refreshDep(); break;
      case 'pick': view.goalId = id; refreshDep(); break;
      case 'key': pressKey(el.dataset.k); break;
      case 'quick': {
        const n = round2((Number(view.amt) || 0) + Number(el.dataset.v));
        if (n <= MAX_AMOUNT) { view.amt = String(n); refreshDep(); }
        break;
      }
      case 'confirm': confirmDep(); break;
      case 'new': showEdit(); break;
      case 'tpl': {
        const tp = TEMPLATES[Number(el.dataset.i)];
        if (!tp) break;
        const g = createGoal(t(tp.k), tp.t, 0);
        save(); render(); showGoal(g.id);
        toast(t('tpl_created'));
        break;
      }
      case 'open': showGoal(id); break;
      case 'close': closeSheet(); break;
      case 'settings': showSettings(); break;
      case 'edit': showEdit(id); break;
      case 'color':
        view.color = Number(el.dataset.i);
        $$('.sw').forEach((b, i) => b.classList.toggle('on', i === view.color));
        break;
      case 'pickphoto': { const f = $('#g-file'); if (f) f.click(); break; }
      case 'rmphoto': view.photo = null; updatePhotoPreview(); break;
      case 'savegoal': saveGoal(); break;
      case 'delentry': {
        const g = state.goals.find(x => x.id === (view && view.id));
        if (!g) break;
        g.entries = g.entries.filter(x => x.id !== id);
        save(); render(); showGoal(g.id); toast(t('entry_deleted'));
        break;
      }
      case 'delgoal':
        if (!arm(el, t('tap_delete'))) break;
        state.goals = state.goals.filter(x => x.id !== id);
        setPhoto(id, null);
        save(); closeSheet(); render(); toast(t('goal_deleted'));
        break;
      case 'copybackup': copyBackup(); break;
      case 'restore': restore(el); break;
      case 'erase':
        if (!arm(el, t('tap_erase'))) break;
        state = { goals: [] };
        save(); prunePhotos(); closeSheet(); render(); toast(t('erased'));
        break;
    }
  });

  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'g-file') onFile(e.target.files && e.target.files[0]);
  });

  applyLang();
  render(true);
})();

</script>
</body>
</html>
